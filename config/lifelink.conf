<VirtualHost *:80>
    ServerName lifelink.local

    # Only public/ is exposed. config/, includes/, database/, scripts/ are NOT reachable from the browser.
    DocumentRoot /var/www/lifelink/public

    <Directory /var/www/lifelink/public>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/lifelink_error.log
    CustomLog ${APACHE_LOG_DIR}/lifelink_access.log combined
</VirtualHost>
